# Site structure for the OpenBoxes Contributor Guide.
# https://gitbook.com/docs/publishing-documentation/site-structure
#
# Two sections, rendered as tabs in the site header. Each section holds one
# space, and each space is a directory containing its own README.md and
# SUMMARY.md.
#
# "Contribute" is the default section, so its slug is not appended to the URL
# and its pages keep the paths they already have. "Maintainers" is not the
# default, so its slug does appear: /maintainers/cut-a-release. Redirects for
# the pages that moved live in maintainers/.gitbook.yaml.
#
# The keys below are stable identity — GitBook matches content across syncs by
# key, not by title, path or directory. Do not rename them.
$schema: https://api.gitbook.com/gitbook-docs.yaml

site:
  title: Contributor Guide
  structure:
    - type: section
      key: section-contributor-guide
      title: Contribute
      path: contribute
      default: true
      children:
        - type: space
          key: space-contributor-guide
          title: Contribute
          path: contributor-guide
          default: true
          content:
            directory: ./contributor-guide

    - type: section
      key: section-maintainers
      title: Maintainers
      path: maintainers
      children:
        - type: space
          key: space-maintainers
          title: Maintainers
          path: maintainers
          default: true
          content:
            directory: ./maintainers
