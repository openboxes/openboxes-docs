# Site structure for the OpenBoxes Contributor Guide.
# https://gitbook.com/docs/docs-as-code/git-sync/monorepos
#
# The guide is a single space. Each space's own .gitbook.yaml, README.md and
# SUMMARY.md live inside its content directory.
$schema: https://api.gitbook.com/gitbook-docs.yaml

site:
  title: Contributor Guide
  structure:
    - type: space
      key: contributor-guide
      title: Contributor Guide
      content:
        directory: ./contributor-guide
